name: ai-voice-receptionist

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.50}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_voice_agent_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CONTAINER_ROLE: backend
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_voice_agent_mvp}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_STARTUP_RETRY_ATTEMPTS: ${DATABASE_STARTUP_RETRY_ATTEMPTS:-30}
      DATABASE_STARTUP_RETRY_BACKOFF_SECONDS: ${DATABASE_STARTUP_RETRY_BACKOFF_SECONDS:-2}
      INITIALIZE_DATABASE_ON_STARTUP: ${INITIALIZE_DATABASE_ON_STARTUP:-true}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_ROOM_NAME: ${LIVEKIT_ROOM_NAME:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BUSINESS_NAME: ${BUSINESS_NAME:-our clinic}
      BUSINESS_TYPE: ${BUSINESS_TYPE:-clinic}
      BUSINESS_SERVICES: ${BUSINESS_SERVICES:-dental cleaning,braces treatment,general consultation}
      RECEPTIONIST_TONE: ${RECEPTIONIST_TONE:-warm, concise, respectful, and phone-friendly}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_EVENT_TYPE_ID: ${CALCOM_EVENT_TYPE_ID:-}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    cpus: ${BACKEND_CPU_LIMIT:-0.75}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/readyz' % os.getenv('PORT', '8000'), timeout=3).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-35s}
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}
    cpus: ${WORKER_CPU_LIMIT:-1.00}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTAINER_ROLE: worker
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      WORKER_ID: ${WORKER_ID:-voice-worker-1}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8081}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-60}
      WORKER_DRAIN_TIMEOUT_SECONDS: ${WORKER_DRAIN_TIMEOUT_SECONDS:-30}
      MAX_CALL_DURATION_SECONDS: ${MAX_CALL_DURATION_SECONDS:-1800}
      CALL_TIMEOUT_WARNING_SECONDS: ${CALL_TIMEOUT_WARNING_SECONDS:-15}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_voice_agent_mvp}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_RETRY_ATTEMPTS: ${DATABASE_RETRY_ATTEMPTS:-2}
      DATABASE_RETRY_BACKOFF_SECONDS: ${DATABASE_RETRY_BACKOFF_SECONDS:-0.05}
      DATABASE_QUEUE_MAX_ITEMS: ${DATABASE_QUEUE_MAX_ITEMS:-500}
      DATABASE_DRAIN_TIMEOUT_SECONDS: ${DATABASE_DRAIN_TIMEOUT_SECONDS:-2}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_ROOM_NAME: ${LIVEKIT_ROOM_NAME:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-bulbul:v3}
      SARVAM_SPEAKER: ${SARVAM_SPEAKER:-kavya}
      SARVAM_LANGUAGE_CODE: ${SARVAM_LANGUAGE_CODE:-en-IN}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v3}
      SARVAM_STT_LANGUAGE_CODE: ${SARVAM_STT_LANGUAGE_CODE:-unknown}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      BUSINESS_NAME: ${BUSINESS_NAME:-our clinic}
      BUSINESS_TYPE: ${BUSINESS_TYPE:-clinic}
      BUSINESS_SERVICES: ${BUSINESS_SERVICES:-dental cleaning,braces treatment,general consultation}
      RECEPTIONIST_TONE: ${RECEPTIONIST_TONE:-warm, concise, respectful, and phone-friendly}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_EVENT_TYPE_ID: ${CALCOM_EVENT_TYPE_ID:-}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    command: ["python", "-m", "voice_agent", "start"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('WORKER_HEALTH_PORT','8081'))), timeout=3); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CONTAINER_ROLE: frontend
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
      API_BASE_URL: ${FRONTEND_INTERNAL_API_BASE_URL:-http://backend:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      FRONTEND_API_TIMEOUT_MS: ${FRONTEND_API_TIMEOUT_MS:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.50}

volumes:
  postgres_data:
