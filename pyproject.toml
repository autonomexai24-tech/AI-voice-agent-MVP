[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aivoiceagent-phase1d"
version = "0.1.0"
description = "Phase 1D inbound SIP to LiveKit STT-to-OpenAI-to-Sarvam-TTS voice agent."
requires-python = ">=3.10"
dependencies = [
  "asyncpg>=0.29",
  "fastapi>=0.110",
  "httpx>=0.27",
  "livekit-agents[sarvam,openai]",
  "livekit-api>=0.8",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
